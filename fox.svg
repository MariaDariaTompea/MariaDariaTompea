<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="150" height="150">
  <defs>
    <!-- Soft shadow gradient -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Gradient for magical cosmic fox fur -->
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" /> <!-- Vibrant orange -->
      <stop offset="100%" stop-color="#E23E57" /> <!-- Neon red-pink -->
    </linearGradient>
    
    <!-- Gradient for inner ears -->
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A" />
      <stop offset="100%" stop-color="#F38181" />
    </linearGradient>
  </defs>

  <style>
    /* Bouncing/jumping animation for the whole fox */
    @keyframes jump {
      0%, 100% {
        transform: translateY(10px) scaleY(1);
      }
      50% {
        transform: translateY(-25px) scaleY(1.05);
      }
    }
    
    /* Tail waving animations with phase offsets */
    @keyframes wagLeft {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes wagMid {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(-8deg) scaleY(1.05); }
    }
    @keyframes wagRight {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-12deg); }
    }
    
    /* Eye blinking animation */
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* Ground shadow scaling animation */
    @keyframes shadowScale {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(0.6); opacity: 0.25; }
    }

    /* Ear twitching animations */
    @keyframes twitchLeft {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-8deg); }
      96% { transform: rotate(4deg); }
    }
    @keyframes twitchRight {
      0%, 85%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(8deg); }
      91% { transform: rotate(-4deg); }
    }

    /* Tassel dangling animation */
    @keyframes dangle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }

    .animated-fox {
      animation: jump 1.6s infinite ease-in-out;
      transform-origin: bottom center;
    }

    .tail-l {
      animation: wagLeft 1.2s infinite ease-in-out;
      transform-origin: 75px 140px;
    }
    
    .tail-m {
      animation: wagMid 1s infinite ease-in-out;
      transform-origin: 100px 145px;
    }
    
    .tail-r {
      animation: wagRight 1.4s infinite ease-in-out;
      transform-origin: 125px 140px;
    }

    .left-ear {
      animation: twitchLeft 3.5s infinite ease-in-out;
      transform-origin: 65px 75px;
    }

    .right-ear {
      animation: twitchRight 4s infinite ease-in-out;
      transform-origin: 135px 75px;
    }

    .eye {
      animation: blink 4s infinite ease-in-out;
      transform-origin: center;
    }

    .tassel {
      animation: dangle 1.6s infinite ease-in-out;
      transform-origin: 100px 62px;
    }

    .ground-shadow {
      animation: shadowScale 1.6s infinite ease-in-out;
      transform-origin: 100px 185px;
    }
  </style>

  <!-- Ground Shadow -->
  <ellipse class="ground-shadow" cx="100" cy="185" rx="45" ry="8" fill="url(#shadowGrad)" />

  <!-- The Fox Body Group (Animated Jump) -->
  <g class="animated-fox">
    
    <!-- ==================== THREE KITSUNE TAILS ==================== -->
    <!-- Left Tail -->
    <g class="tail-l">
      <path d="M 75 140 C 40 135, 10 110, 20 80 C 25 60, 50 60, 60 75 C 70 90, 75 110, 85 130 Z" fill="url(#foxFur)" />
      <path d="M 28 85 C 22 75, 25 60, 35 62 C 38 68, 38 78, 28 85 Z" fill="#FFFFFF" />
    </g>

    <!-- Right Tail -->
    <g class="tail-r">
      <path d="M 125 140 C 160 135, 190 110, 180 80 C 175 60, 150 60, 140 75 C 130 90, 125 110, 115 130 Z" fill="url(#foxFur)" />
      <path d="M 172 85 C 178 75, 175 60, 165 62 C 162 68, 162 78, 172 85 Z" fill="#FFFFFF" />
    </g>

    <!-- Center/Main Tail -->
    <g class="tail-m">
      <path d="M 100 145 C 75 125, 70 85, 90 55 C 100 40, 115 45, 115 65 C 115 85, 110 115, 105 135 Z" fill="url(#foxFur)" />
      <path d="M 92 57 C 98 44, 112 45, 110 58 C 104 62, 97 62, 92 57 Z" fill="#FFFFFF" />
    </g>

    <!-- Feet/Paws (Back) -->
    <ellipse cx="75" cy="165" rx="14" ry="8" fill="#D35400" />
    <ellipse cx="125" cy="165" rx="14" ry="8" fill="#D35400" />

    <!-- Body -->
    <rect x="70" y="115" width="60" height="50" rx="25" fill="url(#foxFur)" />
    <!-- White Chest/Bib -->
    <path d="M 85 115 C 85 145, 115 145, 115 115 C 115 130, 85 130, 85 115 Z" fill="#FFFFFF" />

    <!-- Feet/Paws (Front) -->
    <ellipse cx="90" cy="167" rx="10" ry="8" fill="#FFFFFF" />
    <ellipse cx="110" cy="167" rx="10" ry="8" fill="#FFFFFF" />

    <!-- Left Ear -->
    <g class="left-ear">
      <path d="M 50 85 L 65 30 C 70 35, 80 65, 82 78 Z" fill="url(#foxFur)" />
      <path d="M 55 80 L 67 40 C 70 45, 75 65, 77 75 Z" fill="url(#innerEar)" />
    </g>

    <!-- Right Ear -->
    <g class="right-ear">
      <path d="M 150 85 L 135 30 C 130 35, 120 65, 118 78 Z" fill="url(#foxFur)" />
      <path d="M 145 80 L 133 40 C 130 45, 125 65, 123 75 Z" fill="url(#innerEar)" />
    </g>

    <!-- Head -->
    <ellipse cx="100" cy="95" rx="42" ry="32" fill="url(#foxFur)" />

    <!-- Cheeks (White fluff cheeks) -->
    <path d="M 58 98 C 50 108, 65 118, 75 115 C 65 105, 60 98, 58 98 Z" fill="#FFFFFF" />
    <path d="M 142 98 C 150 108, 135 118, 125 115 C 135 105, 140 98, 142 98 Z" fill="#FFFFFF" />

    <!-- Sparkly Eyes -->
    <g class="eye">
      <!-- Left Eye -->
      <ellipse cx="80" cy="95" rx="7" ry="10" fill="#2C3E50" />
      <circle cx="78" cy="92" r="2.5" fill="#FFFFFF" />
      <circle cx="82" cy="97" r="1.2" fill="#FFFFFF" />
    </g>
    <g class="eye">
      <!-- Right Eye -->
      <ellipse cx="120" cy="95" rx="7" ry="10" fill="#2C3E50" />
      <circle cx="118" cy="92" r="2.5" fill="#FFFFFF" />
      <circle cx="122" cy="97" r="1.2" fill="#FFFFFF" />
    </g>

    <!-- ==================== KITSUNE FACIAL MARKINGS ==================== -->
    <!-- Forehead Magic Diamond -->
    <path d="M 100 74 L 103 80 L 100 86 L 97 80 Z" fill="#E23E57" />
    <!-- Left Eye Cheek Mark -->
    <path d="M 72 102 C 68 100, 68 95, 73 97" stroke="#E23E57" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Right Eye Cheek Mark -->
    <path d="M 128 102 C 132 100, 132 95, 127 97" stroke="#E23E57" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Cute Blush Cheeks -->
    <ellipse cx="68" cy="104" rx="5" ry="3" fill="#F38181" opacity="0.6" />
    <ellipse cx="132" cy="104" rx="5" ry="3" fill="#F38181" opacity="0.6" />

    <!-- Snout & Nose -->
    <polygon points="96,104 104,104 100,108" fill="#2C3E50" />
    <path d="M 98 111 Q 100 113 102 111" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- ==================== GRADUATION MORTARBOARD CAP ==================== -->
    <!-- Cap Base Rim -->
    <ellipse cx="100" cy="68" rx="16" ry="6" fill="#1C2833" />
    <path d="M 84 68 C 84 72, 116 72, 116 68 Z" fill="#0F172A" />
    
    <!-- Top Diamond Plate -->
    <polygon points="76,62 100,54 124,62 100,70" fill="#1E293B" />
    <!-- Highlight on top diamond edge -->
    <polygon points="76,62 100,56 124,62 100,60" fill="#334155" opacity="0.4" />
    
    <!-- Golden Tassel (Animated Dangling) -->
    <circle cx="100" cy="62" r="2.2" fill="#F1C40F" />
    <g class="tassel">
      <!-- Hanging thread -->
      <path d="M 100 62 C 108 63, 113 67, 114 74" stroke="#F1C40F" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Golden fluffy fringe -->
      <path d="M 114 74 L 116 83 L 112 83 Z" fill="#F1C40F" />
    </g>

  </g>
</svg>
